name: Publish image

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/dufelizardo/lonewolf:main
            ghcr.io/dufelizardo/lonewolf:latest
            ghcr.io/dufelizardo/lonewolf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
