apiVersion: apps/v1
kind: Deployment
metadata:
  name: lonewolf-api
  labels:
    app: lonewolf-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lonewolf-api
  template:
    metadata:
      labels:
        app: lonewolf-api
    spec:
      containers:
        - name: lonewolf-api
          image: ghcr.io/dufelizardo/lonewolf-api:57be355878d0d0131e7def49fc2963b16a9e8310
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: lonewolf-postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: lonewolf
            - name: PGUSER
              value: lonewolf
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lonewolf-postgres-secret
                  key: POSTGRES_PASSWORD
          # Segura readiness/liveness até a API responder - o processo pode levar até ~20s pra
          # subir na pior hipótese (retry com backoff em ensureSchemaWithRetry() esperando o
          # Postgres aceitar conexões, ver api/src/index.ts). 10x3s = 30s de folga antes de
          # liveness/readiness passarem a valer.
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
