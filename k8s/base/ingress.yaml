apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lonewolf
spec:
  ingressClassName: traefik
  rules:
    - host: lonewolf.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lonewolf-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lonewolf
                port:
                  number: 80
