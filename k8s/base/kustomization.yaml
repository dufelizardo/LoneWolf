apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lonewolf

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - deployment-mdns.yaml

# Nome na rede local por mDNS (deployment-mdns.yaml).
configMapGenerator:
  - name: mdns-anunciador
    files:
      - mdns/anunciador.py
  - name: mdns-config
    literals:
      - MDNS_NOME=lonewolf.local
