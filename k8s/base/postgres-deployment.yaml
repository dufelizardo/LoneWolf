apiVersion: apps/v1
kind: Deployment
metadata:
  name: lonewolf-postgres
  labels:
    app: lonewolf-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lonewolf-postgres
  template:
    metadata:
      labels:
        app: lonewolf-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lonewolf
            - name: POSTGRES_USER
              value: lonewolf
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lonewolf-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lonewolf-postgres
